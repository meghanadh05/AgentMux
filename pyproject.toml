[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amx"
version = "0.1.0"
description = "VS Code agent account switcher, currently supporting Codex"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "AgentMux contributors" }]
keywords = ["codex", "vscode", "account-switcher"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.scripts]
amx = "amx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["amx"]

[tool.hatch.build]
artifacts = ["amx/vscode_extension/agentmux-vscode.vsix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
